<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backend API Test</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        h1 {
            margin-bottom: 30px;
            text-align: center;
        }
        .test-section {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
            border-left: 4px solid #4caf50;
        }
        .test-section.error {
            border-left-color: #f44336;
        }
        button {
            background: #4caf50;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
            transition: background 0.3s;
        }
        button:hover {
            background: #45a049;
        }
        .result {
            margin-top: 15px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
        .success {
            color: #4caf50;
            font-weight: bold;
        }
        .error-text {
            color: #f44336;
            font-weight: bold;
        }
        .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 10px;
        }
        .status.running {
            background: #ff9800;
        }
        .status.success {
            background: #4caf50;
        }
        .status.failed {
            background: #f44336;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔌 Backend API Connection Tester</h1>
        
        <div class="test-section" id="backend-status">
            <h3>Backend Status <span class="status running" id="backend-badge">Checking...</span></h3>
            <p>Testing connection to: <code>http://localhost:8080</code></p>
            <button onclick="testBackendHealth()">Test Backend Health</button>
            <div class="result" id="backend-result"></div>
        </div>

        <div class="test-section" id="products-status">
            <h3>Products API <span class="status running" id="products-badge">Not Tested</span></h3>
            <p>Testing: <code>GET /api/v1/users/allproducts</code></p>
            <button onclick="testProducts()">Fetch Products</button>
            <div class="result" id="products-result"></div>
        </div>

        <div class="test-section" id="signup-status">
            <h3>Signup Test <span class="status running" id="signup-badge">Not Tested</span></h3>
            <p>Testing: <code>POST /api/v1/users/signup</code></p>
            <button onclick="testSignup()">Test Signup Endpoint</button>
            <div class="result" id="signup-result"></div>
        </div>
    </div>

    <script>
        const BASE_URL = 'http://localhost:8080/api/v1';

        function updateStatus(badgeId, status) {
            const badge = document.getElementById(badgeId);
            badge.className = `status ${status}`;
            badge.textContent = status.toUpperCase();
        }

        async function testBackendHealth() {
            const resultDiv = document.getElementById('backend-result');
            resultDiv.innerHTML = 'Testing...';
            
            try {
                const response = await fetch('http://localhost:8080');
                
                if (response.ok) {
                    resultDiv.innerHTML = `<span class="success">✅ Backend is RUNNING!</span>\nStatus: ${response.status}\nURL: http://localhost:8080`;
                    updateStatus('backend-badge', 'success');
                } else {
                    throw new Error(`HTTP ${response.status}`);
                }
            } catch (error) {
                resultDiv.innerHTML = `<span class="error-text">❌ Backend Connection Failed</span>\nError: ${error.message}\n\nMake sure backend is running on port 8080`;
                updateStatus('backend-badge', 'failed');
            }
        }

        async function testProducts() {
            const resultDiv = document.getElementById('products-result');
            resultDiv.innerHTML = 'Fetching products...';
            
            try {
                const response = await fetch(`${BASE_URL}/users/allproducts`);
                const data = await response.json();
                
                if (response.ok) {
                    const products = data.data || [];
                    resultDiv.innerHTML = `<span class="success">✅ Products fetched successfully!</span>\n\nTotal products: ${products.length}\n\nSample Response:\n${JSON.stringify(data, null, 2).substring(0, 500)}...`;
                    updateStatus('products-badge', 'success');
                } else {
                    throw new Error(`HTTP ${response.status}: ${data.message || 'Unknown error'}`);
                }
            } catch (error) {
                resultDiv.innerHTML = `<span class="error-text">❌ Failed to fetch products</span>\nError: ${error.message}`;
                updateStatus('products-badge', 'failed');
            }
        }

        async function testSignup() {
            const resultDiv = document.getElementById('signup-result');
            resultDiv.innerHTML = 'Testing signup endpoint...';
            
            const testEmail = `test${Date.now()}@example.com`;
            
            try {
                const response = await fetch(`${BASE_URL}/users/signup`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        name: 'Test User',
                        email: testEmail,
                        password: 'TestPass123'
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `<span class="success">✅ Signup endpoint working!</span>\n\nTest email: ${testEmail}\nResponse:\n${JSON.stringify(data, null, 2)}`;
                    updateStatus('signup-badge', 'success');
                } else {
                    // Even if signup fails due to validation, endpoint is working
                    resultDiv.innerHTML = `<span class="success">✅ Signup endpoint is reachable</span>\n\nStatus: ${response.status}\nResponse:\n${JSON.stringify(data, null, 2)}`;
                    updateStatus('signup-badge', 'success');
                }
            } catch (error) {
                resultDiv.innerHTML = `<span class="error-text">❌ Cannot reach signup endpoint</span>\nError: ${error.message}`;
                updateStatus('signup-badge', 'failed');
            }
        }

        // Auto-test backend on load
        window.onload = () => {
            testBackendHealth();
        };
    </script>
</body>
</html>
